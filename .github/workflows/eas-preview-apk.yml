name: EAS Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/eas-preview-readiness
    paths:
      - '.github/workflows/eas-preview-apk.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: eas-preview-apk
  cancel-in-progress: false

jobs:
  submit-preview-build:
    name: Submit Android preview APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish submission pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n             --arg state pending             --arg context eas-preview-submit             --arg description "Submitting Android preview APK to EAS"             --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify approved Events client-gate fix
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm test -- --runInBand
          grep -Fq 'process.env.EXPO_PUBLIC_FEATURE_EVENTS' src/lib/events-feature.ts
          if grep -Fq 'globalThis' src/lib/events-feature.ts; then
            echo "::error::Events feature flags must use Expo-compatible static environment references."
            exit 1
          fi

      - name: Require Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi

      - name: Verify EAS Preview Supabase project pair
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          approved_ref="opeojxwkwwnnncnsuaag"
          approved_url="https://${approved_ref}.supabase.co"
          rejected_ref="ojsbfxrumrqgnuwftnrf"
          preview_env="${RUNNER_TEMP}/eas-preview.env"

          npx --yes eas-cli@21.4.0 env:pull preview \
            --path "$preview_env" \
            --non-interactive

          set -a
          # shellcheck disable=SC1090
          source "$preview_env"
          set +a

          supabase_url="${EXPO_PUBLIC_SUPABASE_URL:-}"
          supabase_key="${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}"

          echo "::add-mask::$supabase_url"
          echo "::add-mask::$supabase_key"

          if [ "$supabase_url" != "$approved_url" ]; then
            echo "::error::EAS Preview does not target the approved Supabase project reference."
            exit 1
          fi

          if [[ ! "$supabase_key" =~ ^sb_publishable_ ]]; then
            echo "::error::EAS Preview key is not a Supabase publishable key."
            exit 1
          fi

          if [[ "$supabase_url" == *"$rejected_ref"* ]]; then
            echo "::error::EAS Preview still targets the rejected Supabase project."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --output /dev/null \
            --header "apikey: $supabase_key" \
            "$supabase_url/auth/v1/settings"

          echo "EAS Preview uses the authenticated approved Supabase project pair."

      - name: Submit EAS cloud Android APK build
        id: submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cloud_log="$(mktemp)"
          set +e
          npx --yes eas-cli@21.4.0 build --platform android --profile preview --non-interactive --no-wait 2>&1 | tee "$cloud_log"
          cloud_status=${PIPESTATUS[0]}
          set -e

          if [ "$cloud_status" -ne 0 ]; then
            if grep -Fq 'has used its Android builds from the Free plan this month' "$cloud_log"; then
              echo "EAS cloud quota is exhausted; switching to a local GitHub-hosted build."
              echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "::error::EAS cloud build submission failed for a reason other than quota exhaustion."
            exit "$cloud_status"
          fi

          echo "quota_exhausted=false" >> "$GITHUB_OUTPUT"

          for attempt in $(seq 1 10); do
            builds="$(npx --yes eas-cli@21.4.0 build:list --platform android --limit 10 --json 2>/tmp/eas-list.log)"
            build="$(printf '%s' "$builds" | jq -c --arg sha "$GITHUB_SHA" 'map(select(.gitCommitHash == $sha)) | first // empty')"

            if [ -n "$build" ]; then
              build_id="$(printf '%s' "$build" | jq -r '.id')"
              details_url="https://expo.dev/accounts/mycorner/projects/my-corner/builds/${build_id}"
              echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
              echo "details_url=${details_url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          cat /tmp/eas-list.log
          echo "::error::Build was submitted, but its EAS record could not be located."
          exit 1

      - name: Monitor EAS cloud Android APK build
        if: steps.submit.outputs.quota_exhausted == 'false'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.submit.outputs.build_id }}
        run: |
          for attempt in $(seq 1 120); do
            build="$(npx --yes eas-cli@21.4.0 build:view "$BUILD_ID" --json)"
            status="$(printf '%s' "$build" | jq -r '.status')"

            case "$status" in
              FINISHED)
                echo "EAS cloud Android preview APK completed."
                exit 0
                ;;
              ERRORED|CANCELED)
                echo "::error::EAS cloud Android preview APK ended with status $status."
                exit 1
                ;;
            esac

            sleep 30
          done

          echo "::error::Timed out waiting for the EAS cloud Android preview APK."
          exit 1

      - name: Build Android preview APK locally
        id: local_build
        if: steps.submit.outputs.quota_exhausted == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          apk_path="${RUNNER_TEMP}/my-corner-preview-${GITHUB_SHA::7}.apk"
          npx --yes eas-cli@21.4.0 build \
            --platform android \
            --profile preview \
            --non-interactive \
            --local \
            --output "$apk_path"
          test -s "$apk_path"
          echo "apk_path=${apk_path}" >> "$GITHUB_OUTPUT"

      - name: Upload locally built preview APK
        if: steps.submit.outputs.quota_exhausted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: my-corner-preview-${{ github.sha }}
          path: ${{ steps.local_build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Select build details
        id: details
        env:
          CLOUD_DETAILS_URL: ${{ steps.submit.outputs.details_url }}
          USED_LOCAL_BUILD: ${{ steps.submit.outputs.quota_exhausted }}
        run: |
          if [ "$USED_LOCAL_BUILD" = "true" ]; then
            echo "description=Android preview APK available in workflow artifacts" >> "$GITHUB_OUTPUT"
            echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          else
            echo "description=Android preview APK completed in EAS" >> "$GITHUB_OUTPUT"
            echo "url=${CLOUD_DETAILS_URL}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish submission success
        env:
          GH_TOKEN: ${{ github.token }}
          DETAILS_DESCRIPTION: ${{ steps.details.outputs.description }}
          DETAILS_URL: ${{ steps.details.outputs.url }}
        run: |
          payload="$(jq -n             --arg state success             --arg context eas-preview-submit             --arg description "$DETAILS_DESCRIPTION"             --arg target_url "$DETAILS_URL"             '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"


      - name: Publish submission failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n             --arg state failure             --arg context eas-preview-submit             --arg description "Android preview APK submission failed"             --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
