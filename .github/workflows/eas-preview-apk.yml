name: EAS Preview APK
# Founder approved exactly one Home redesign Preview APK on 2026-10-10.
# Application checkout is pinned to merged PR #180 source 9adacca341cb4f4a4b4897932d28052aa68108bb.
# Native acceptance remains pending; no backend deployment.
# Only an explicit "Build approved EAS Preview APK" commit submits a new build.

on:
  push:
    branches:
      - main
      - codex/vc-media-foundation
      - codex/ask-intent-preview-apk
      - codex/ask-quota-preview-apk
      - codex/feed-discovery-preview-apk
      - codex/vc-requester-preview-apk
      - codex/session-ux-preview-apk
      - codex/combined-preview-173-174
      - codex/provider-cta-preview-apk
      - codex/home-preview-9adacca
    paths:
      - '.github/workflows/eas-preview-apk.yml'
  workflow_dispatch:
    inputs:
      founder_approved:
        description: 'Founder approved a new paid EAS preview build'
        required: true
        default: false
        type: boolean
      existing_build_id:
        description: 'Existing completed EAS build ID to inspect without starting a new build'
        required: false
        default: '1597cda3-24a0-4a17-91a6-4b41765c2c77'
        type: string

env:
  SOURCE_COMMIT: 9adacca341cb4f4a4b4897932d28052aa68108bb

permissions:
  contents: read

concurrency:
  group: eas-preview-apk
  cancel-in-progress: false

jobs:
  build-and-verify-preview:
    name: Build and verify Android preview APK
    if: >-
      (github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'Build approved EAS Preview APK')) ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.founder_approved == true || inputs.existing_build_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: 9adacca341cb4f4a4b4897932d28052aa68108bb

      - name: Verify approved source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Events preview contract
        run: npm run verify:preview

      - name: Run release gates
        run: |
          npm run format
          npm run lint
          npm run typecheck
          npm test -- --runInBand

      - name: Require Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi

      - name: Verify EAS preview Supabase environment
        if: github.event_name == 'push' || inputs.existing_build_id == ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@22.6.0 env:exec \
            preview \
            'node scripts/verify-preview-supabase-env.mjs' \
            --non-interactive

      - name: Prevent duplicate approved Preview submission
        if: github.event_name == 'push' || inputs.existing_build_id == ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@22.6.0 build:list --platform android --build-profile preview --limit 50 --json --non-interactive > "${RUNNER_TEMP}/existing-preview-builds.json"
          jq '[.[] | {id, status, createdAt, gitCommitHash, appBuildVersion}]' "${RUNNER_TEMP}/existing-preview-builds.json"
          if jq -e --arg source "$SOURCE_COMMIT" 'any(.[]; (.gitCommitHash == $source) or (.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS" or .status == "PENDING_CANCEL") or (.createdAt >= "2026-09-25T00:00:00Z" and .status == "FINISHED" and .id != "a352ebca-9cee-4155-b564-125df0a67288" and .id != "34e50a41-a32d-42ce-93b7-8baf91518764" and .id != "b30911f6-4b82-47ef-91d2-38e7732cd0e2" and .id != "c7f685a6-6ffc-4463-99ac-626b7f61c8a2" and .id != "b6ea9558-74c4-49fe-9f28-f8a9baed72ff" and .id != "6f96b91b-8358-47e9-ac5d-5aee15058497" and .id != "8608e3fd-fe98-4d7a-88ac-713830f806e9" and .id != "d8716a23-5845-409d-9286-216a49566ce6" and .id != "234dd105-1a06-469e-b16a-c8b42cea6e78" and .id != "56b70a4b-0f0d-4e67-8709-6625a6848192" and .id != "2646d53a-c144-40f2-9b2b-ff5db9e78644" and .id != "63a99013-52d6-4d35-9034-c3869cca6209" and .id != "79bef3d4-bfb4-42fd-ab9e-7829e7c5bbf5" and .id != "22aaa804-4df7-48bc-87ff-40673021faac" and .id != "72d18404-4aa5-48b9-a49c-98ab4026e0ec"))' "${RUNNER_TEMP}/existing-preview-builds.json" > /dev/null; then
            echo "::error::An active or newer completed Preview build exists. Inspect and reuse it; do not submit a duplicate."
            exit 1
          fi

      - name: Submit EAS cloud Android APK build
        id: submit
        if: github.event_name == 'push' || inputs.existing_build_id == ''
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cloud_log="${RUNNER_TEMP}/eas-submit.log"
          set +e
          npx --yes eas-cli@22.6.0 build             --platform android             --profile preview             --non-interactive             --no-wait 2>&1 | tee "$cloud_log"
          cloud_status=${PIPESTATUS[0]}
          set -e

          if [ "$cloud_status" -ne 0 ]; then
            echo "::error::EAS cloud build submission failed."
            exit "$cloud_status"
          fi

          details_url="$(grep -Eo             'https://expo\.dev/accounts/[^/]+/projects/[^/]+/builds/[0-9a-f-]{36}'             "$cloud_log" | tail -n 1 || true)"
          build_id="${details_url##*/}"

          if ! printf '%s' "$build_id" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::The real EAS build ID could not be parsed from submission output."
            exit 1
          fi

          echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
          echo "details_url=${details_url}" >> "$GITHUB_OUTPUT"
          echo "Recorded EAS build ID: ${build_id}"

      - name: Resolve EAS build ID
        id: build
        env:
          EXISTING_BUILD_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_build_id || '' }}
          SUBMITTED_BUILD_ID: ${{ steps.submit.outputs.build_id }}
          SUBMITTED_DETAILS_URL: ${{ steps.submit.outputs.details_url }}
        run: |
          build_id="${EXISTING_BUILD_ID:-$SUBMITTED_BUILD_ID}"
          if ! printf '%s' "$build_id" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::A valid real EAS build ID is required."
            exit 1
          fi
          details_url="$SUBMITTED_DETAILS_URL"
          if [ -z "$details_url" ]; then
            details_url="https://expo.dev/builds/$build_id"
            echo "Reusing existing EAS build ID: $build_id; no new build submitted."
          fi
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "details_url=$details_url" >> "$GITHUB_OUTPUT"

      - name: Persist build receipt before waiting
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          DETAILS_URL: ${{ steps.build.outputs.details_url }}
        run: |
          jq -n --arg buildId "$BUILD_ID" --arg source "$SOURCE_COMMIT" --arg url "$DETAILS_URL" \
            '{buildId: $buildId, source: $source, detailsUrl: $url}' > "${RUNNER_TEMP}/preview-build-receipt.json"
          echo "Submitted/reused EAS build: $BUILD_ID ($DETAILS_URL), source $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload submitted build receipt
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/preview-build-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Wait for final EAS result
        id: completed
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          build_json="${RUNNER_TEMP}/eas-build.json"

          for attempt in $(seq 1 120); do
            if npx --yes eas-cli@22.6.0 build:view "$BUILD_ID" --json > "$build_json" 2>"${RUNNER_TEMP}/eas-view.log"; then
              status="$(jq -r '.status // empty' "$build_json")"
              echo "EAS build status: ${status:-unknown}"

              case "$status" in
                FINISHED)
                  artifact_url="$(jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty' "$build_json")"
                  if [ -z "$artifact_url" ]; then
                    echo "::error::Finished EAS build has no APK artifact URL."
                    exit 1
                  fi
                  echo "artifact_url=${artifact_url}" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
                ERRORED|CANCELED)
                  jq '{id, status, error, gitCommitHash, artifacts}' "$build_json"
                  echo "::error::EAS build ended with status ${status}."
                  exit 1
                  ;;
              esac
            else
              cat "${RUNNER_TEMP}/eas-view.log"
            fi

            sleep 30
          done

          echo "::error::Timed out waiting for final EAS build completion."
          exit 1

      - name: Download completed APK
        id: artifact
        env:
          ARTIFACT_URL: ${{ steps.completed.outputs.artifact_url }}
        run: |
          apk_path="${RUNNER_TEMP}/my-corner-preview-${SOURCE_COMMIT::7}.apk"
          curl --fail --location --retry 4 --retry-all-errors "$ARTIFACT_URL" --output "$apk_path"
          test -s "$apk_path"
          echo "apk_path=${apk_path}" >> "$GITHUB_OUTPUT"

      - name: Inspect APK provenance and product media bytecode
        id: verify_apk
        env:
          APK_PATH: ${{ steps.artifact.outputs.apk_path }}
          BUILD_ID: ${{ steps.build.outputs.build_id }}
        run: |
          recorded_commit="$(jq -r '.gitCommitHash // empty' "${RUNNER_TEMP}/eas-build.json")"
          if [ "$recorded_commit" != "$SOURCE_COMMIT" ]; then
            echo "::error::EAS source commit does not match the checked-out build commit."
            exit 1
          fi
          unzip -tq "$APK_PATH"
          unzip -Z1 "$APK_PATH" | grep -Fx 'assets/app.config'
          unzip -Z1 "$APK_PATH" | grep -Fx 'assets/index.android.bundle'

          bundle_path="${RUNNER_TEMP}/index.android.bundle"
          dump_path="${RUNNER_TEMP}/index.android.dump"
          unzip -p "$APK_PATH" assets/index.android.bundle > "$bundle_path"
          test -s "$bundle_path"

          strings -a -n 4 "$bundle_path" > "$dump_path"
          grep -Fq 'is_events_feature_enabled' "$dump_path"
          grep -Fq 'Events is not available yet.' "$dump_path"
          grep -Fq 'Marketplace reports' "$dump_path"
          grep -Fq 'Block listing' "$dump_path"
          for marker in 'begin_media_upload' 'attach_media' 'process-media' 'Group photos and video' 'Listing video' 'Photos or video of the work' 'Event cover, photos and video' 'Add or change profile picture'; do
            grep -Fq "$marker" "$dump_path"
          done

          supabase_urls="$(grep -Eo 'https://[a-z]{20}\.supabase\.co' "$dump_path" | sort -u || true)"
          expected_supabase_url='https://opeojxwkwwnnncnsuaag.supabase.co'
          if [ "$supabase_urls" != "$expected_supabase_url" ]; then
            echo "::error::Expected only staging Supabase URL $expected_supabase_url; found: ${supabase_urls:-none}"
            exit 1
          fi
          supabase_url="$supabase_urls"

          apkanalyzer_path="$(command -v apkanalyzer || find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1 || true)"
          if [ -z "$apkanalyzer_path" ]; then
            echo "::error::apkanalyzer is unavailable."
            exit 1
          fi
          application_id="$("$apkanalyzer_path" manifest application-id "$APK_PATH")"
          test "$application_id" = 'com.mycorner.trustedpeople'
          version_code="$("$apkanalyzer_path" manifest version-code "$APK_PATH")"
          echo "Verified Android version code: $version_code"
          test "$version_code" -gt 56

          # Verify the new icon font is embedded unchanged in the actual APK.
          python3 - <<'PYFONT'
          import os, zipfile
          from pathlib import Path
          expected = Path('assets/navigation/MyCornerNavigation.ttf').read_bytes()
          with zipfile.ZipFile(os.environ['APK_PATH']) as apk:
              matches = [entry.filename for entry in apk.infolist()
                         if entry.file_size == len(expected) and apk.read(entry) == expected]
          if not matches:
              raise SystemExit('Replacement navigation font missing or different in APK')
          print('Verified replacement navigation font:', ', '.join(matches))
          expected_character = Path('assets/my-corner-ai/characters/character-woman-kente.png').read_bytes()
          with zipfile.ZipFile(os.environ['APK_PATH']) as apk:
              character_matches = [entry.filename for entry in apk.infolist()
                                   if entry.file_size == len(expected_character) and apk.read(entry) == expected_character]
          if not character_matches:
              raise SystemExit('Approved Home AI character missing or different in APK')
          print('Verified approved Home AI character:', ', '.join(character_matches))
          # Hermes stores this label as UTF-16 because its string includes a middle dot.
          with zipfile.ZipFile(os.environ['APK_PATH']) as apk:
              bundle = apk.read('assets/index.android.bundle')
          for label in ('Hire Trusted Local Help', 'LATEST FEED UPDATES', 'MARKETPLACE SHOWCASE', 'AGENCY BROADCAST', 'Send neighborhood question', 'Continue your post', 'Close composer', 'Read full post', 'Show less', 'New listing', 'Continue listing', 'Start request', 'Refresh interested neighbors', 'Public name unavailable', 'checkbox', 'Select the trust acknowledgement checkbox before submitting.', 'Retry opening My Corner', 'content_public_names', 'I understand My Corner shows trust evidence but does not guarantee provider conduct', 'Verified Job', 'Hide comments', 'Go back', 'View / Edit Review', 'Thanks for helping neighbors make informed decisions.', 'Ask My Corner', 'ask-my-corner', 'neighborhood_ai_context', 'neighborhood_ai_meter', 'Ask My Corner AI', 'Ask anything about your neighborhood...', 'My Corner AI is checking your neighborhood...', 'Ask My Corner AI is temporarily unavailable. You can still use Search.', 'Active Requests (', 'Past Requests (', 'Public display name', 'Save public display name', 'own_public_name', 'Choose the public name neighbors will see. Your legal identity stays private.', 'Is this provider available today?', 'confirmed completed My Corner jobs', 'Provider-stated availability:', 'ASK_ALLOWANCE_REACHED', 'The Preview question limit has been reached. Try again later or use Search.', 'feed_author_names', 'Providers across service areas. Check each provider’s listed coverage before starting a request.'):
              if not any(label.encode(encoding) in bundle for encoding in ('utf-8', 'utf-16le')):
                  raise SystemExit(f'Required UX label missing from APK: {label}')
          for obsolete in ('Review and Accept', 'Acknowledgement accepted'):
              if any(obsolete.encode(encoding) in bundle for encoding in ('utf-8', 'utf-16le')):
                  raise SystemExit(f'Obsolete acknowledgement UI remains in APK: {obsolete}')
          PYFONT
          grep -Fq 'MyCornerNavigation' "$dump_path"
          for marker in 'review_api' 'messaging_api' 'notification_api'; do
            grep -Fq "$marker" "$dump_path"
          done

          apk_sha256="$(sha256sum "$APK_PATH" | awk '{print $1}')"
          echo "Verified APK SHA-256: $apk_sha256"
          supabase_ref="$(printf '%s' "$supabase_url" | sed -E 's#https://([a-z]{20})\.supabase\.co#\1#')"
          provenance_path="${RUNNER_TEMP}/preview-provenance.json"
          jq -n             --arg buildId "$BUILD_ID"             --arg commit "$SOURCE_COMMIT"             --arg applicationId "$application_id"             --arg supabaseRef "$supabase_ref"             --arg apkSha256 "$apk_sha256"             '{buildId: $buildId, commit: $commit, applicationId: $applicationId, supabaseRef: $supabaseRef, apkSha256: $apkSha256, eventsBytecodeVerified: true, productMediaBytecodeVerified: true, sourceCommitVerified: true, navigationFontVerified: true, askMyCornerBytecodeVerified: true, assistantFollowUpBytecodeVerified: true, assistantQuotaMessageVerified: true, feedPublicNameRpcVerified: true, providerCoverageCopyVerified: true}'             > "$provenance_path"

          echo "provenance_path=${provenance_path}" >> "$GITHUB_OUTPUT"
          echo "Verified APK for Supabase project ${supabase_ref}."

      - name: Upload verified APK and provenance
        uses: actions/upload-artifact@v4
        with:
          name: my-corner-preview-verified-${{ github.sha }}
          path: |
            ${{ steps.artifact.outputs.apk_path }}
            ${{ steps.verify_apk.outputs.provenance_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified build summary
        env:
          BUILD_ID: ${{ steps.build.outputs.build_id }}
          DETAILS_URL: ${{ steps.build.outputs.details_url }}
          APK_URL: ${{ steps.completed.outputs.artifact_url }}
        run: |
          {
            echo "## Verified Android preview APK"
            echo
            echo "- EAS build ID: \`$BUILD_ID\`"
            echo "- EAS details: $DETAILS_URL"
            echo "- Commit: \`$SOURCE_COMMIT\`"
            echo "- APK download: $APK_URL"
            echo "- APK and provenance: workflow artifact"
          } >> "$GITHUB_STEP_SUMMARY"
