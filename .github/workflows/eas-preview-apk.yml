name: EAS Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/eas-preview-readiness
    paths:
      - '.github/workflows/eas-preview-apk.yml'

permissions:
  contents: read
  issues: write
  statuses: write

concurrency:
  group: eas-preview-apk
  cancel-in-progress: false

env:
  PR_NUMBER: '38'

jobs:
  submit-preview-build:
    name: Submit Android preview APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Publish submission pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n             --arg state pending             --arg context eas-preview-submit             --arg description "Submitting Android preview APK to EAS"             --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Require Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi

      - name: Submit EAS internal Android APK build
        id: submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@21.4.0 build --platform android --profile preview --non-interactive --no-wait

          for attempt in $(seq 1 10); do
            builds="$(npx --yes eas-cli@21.4.0 build:list --platform android --limit 10 --json 2>/tmp/eas-list.log)"
            build="$(printf '%s' "$builds" | jq -c --arg sha "$GITHUB_SHA" 'map(select(.gitCommitHash == $sha)) | first // empty')"

            if [ -n "$build" ]; then
              build_id="$(printf '%s' "$build" | jq -r '.id')"
              details_url="https://expo.dev/accounts/mycorner/projects/my-corner/builds/${build_id}"
              echo "build_id=${build_id}" >> "$GITHUB_OUTPUT"
              echo "details_url=${details_url}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 15
          done

          cat /tmp/eas-list.log
          echo "::error::Build was submitted, but its EAS record could not be located."
          exit 1

      - name: Publish submission success
        env:
          GH_TOKEN: ${{ github.token }}
          DETAILS_URL: ${{ steps.submit.outputs.details_url }}
        run: |
          payload="$(jq -n             --arg state success             --arg context eas-preview-submit             --arg description "Android preview APK submitted to EAS"             --arg target_url "$DETAILS_URL"             '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"

          comment="$(jq -n --arg body "Android preview APK submitted to EAS. Build details: ${DETAILS_URL}" '{body: $body}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --data "$comment"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments"

      - name: Publish submission failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(jq -n             --arg state failure             --arg context eas-preview-submit             --arg description "Android preview APK submission failed"             --arg target_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"             '{state: $state, context: $context, description: $description, target_url: $target_url}')"
          curl --fail-with-body --silent --show-error             --request POST             --header "Authorization: Bearer ${GH_TOKEN}"             --header "Accept: application/vnd.github+json"             --header "X-GitHub-Api-Version: 2022-11-28"             --data "$payload"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
