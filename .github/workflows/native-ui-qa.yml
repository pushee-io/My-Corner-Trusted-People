name: Native UI component QA

# Native fixtures are an explicit QA task; routine fixes use Mobile CI.
# Do not automatically repeat emulator capture on every mobile commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-components:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install and prepare test-only native entry
        working-directory: mobile
        env:
          MC_QA_BASELINE: 758e0f0f6f192d053b6079665894103da21e91c0
          MC_QA_PHASE: B
        run: |
          npm ci
          node scripts/prepare-native-ui-qa.cjs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual native components
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          working-directory: mobile
          script: |
            mkdir -p "$RUNNER_TEMP/native-ui-qa"
            CI=1 EXPO_NO_TELEMETRY=1 npx expo start --android --localhost --port 8081 > "$RUNNER_TEMP/native-ui-qa/metro.log" 2>&1 &
            MC_QA_OUTPUT="$RUNNER_TEMP/native-ui-qa" python scripts/capture-native-ui-qa.py
      - name: Upload native evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ui-components
          path: ${{ runner.temp }}/native-ui-qa
          if-no-files-found: warn
