name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - 'supabase/functions/_shared/neighborhood-*.ts'
      - 'supabase/functions/_shared/openai-responses.ts'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/eas-preview-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'supabase/functions/_shared/neighborhood-*.ts'
      - 'supabase/functions/_shared/openai-responses.ts'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/eas-preview-apk.yml'
  workflow_dispatch:

jobs:
  verify-mobile:
    name: Install and verify mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Verify preview build contract
        run: npm run verify:preview

      - name: Verify Expo dependency compatibility
        run: npx expo-doctor

      - name: Check formatting
        id: formatting
        run: npm run format

      - name: Report exact formatting repairs
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const prettier = require('prettier');
          (async () => {
            const paths = execFileSync('git', ['ls-files'], { encoding: 'utf8' }).trim().split('\n');
            for (const file of paths) {
              const info = await prettier.getFileInfo(file, { ignorePath: '.prettierignore' });
              if (info.ignored || !info.inferredParser) continue;
              const input = fs.readFileSync(file, 'utf8');
              const formatted = await prettier.format(input, { ...(await prettier.resolveConfig(file)), filepath: file });
              if (formatted !== input) console.log('FORMAT_REPAIR ' + JSON.stringify({ path: 'mobile/' + file, content: formatted }));
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test -- --runInBand

      - name: Capture trust acknowledgement component states
        run: node scripts/capture-trust-acknowledgement.cjs "$RUNNER_TEMP/trust-acknowledgement"

      - name: Upload trust acknowledgement visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: trust-acknowledgement-component-states
          path: ${{ runner.temp }}/trust-acknowledgement
          if-no-files-found: error

      - name: Verify web bundle
        run: npx expo export --platform web --output-dir dist-ci

      - name: Capture shared UI foundations before and after
        run: node scripts/capture-ui-foundations.cjs "$RUNNER_TEMP/ui-foundations"

      - name: Upload shared UI foundations evidence
        uses: actions/upload-artifact@v4
        with:
          name: ui-foundations-component-states
          path: ${{ runner.temp }}/ui-foundations
          if-no-files-found: error

      - name: Capture Home dashboard review fixtures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/capture-home-dashboard.cjs "$RUNNER_TEMP/home-dashboard"

      - name: Upload Home dashboard review evidence
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: home-dashboard-review
          path: ${{ runner.temp }}/home-dashboard
          if-no-files-found: error

      - name: Verify Android bundle
        run: npx expo export --platform android --output-dir dist-android-ci
