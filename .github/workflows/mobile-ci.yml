name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  workflow_dispatch:

jobs:
  verify-mobile:
    name: Install and verify mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo dependency compatibility
        run: npx expo-doctor

      - name: Check formatting
        run: |
          npx prettier --write src/lib/__tests__/supabase.test.ts
          git diff -- src/lib/__tests__/supabase.test.ts
          git diff --exit-code -- src/lib/__tests__/supabase.test.ts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Verify web bundle
        run: npx expo export --platform web --output-dir dist-ci
