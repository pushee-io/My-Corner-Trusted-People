name: Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/eas-preview-apk.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
      - '.github/workflows/eas-preview-apk.yml'
  workflow_dispatch:

jobs:
  verify-mobile:
    name: Install and verify mobile app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify preview build contract
        run: npm run verify:preview

      - name: Verify Expo dependency compatibility
        run: npx expo-doctor

      - name: Check formatting
        run: |
          npx prettier scripts/verify-preview-contract.mjs > "${RUNNER_TEMP}/verify-preview-contract.formatted.mjs"
          diff -u scripts/verify-preview-contract.mjs "${RUNNER_TEMP}/verify-preview-contract.formatted.mjs" || true
          npm run format

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --runInBand

      - name: Verify web bundle
        run: npx expo export --platform web --output-dir dist-ci
