name: Sync EAS preview Supabase public key

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/eas-preview-key-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-preview-key-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Replace and verify preview client key
    environment: preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: opeojxwkwwnnncnsuaag

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require management credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Retrieve, validate, and mask current publishable key
        id: key
        run: |
          keys_json="$(curl --fail --silent --show-error \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/api-keys?reveal=true" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"

          current_key="$(printf '%s' "$keys_json" | jq -r '
            [
              .[]
              | select(.type == "publishable")
              | select(.api_key | type == "string")
              | select(.api_key | startswith("sb_publishable_"))
            ]
            | sort_by(.updated_at // .inserted_at // "")
            | last
            | .api_key // empty
          ')"
          unset keys_json

          if [ -z "$current_key" ]; then
            echo "::error::No current Supabase publishable key was returned for the approved project."
            exit 1
          fi

          echo "::add-mask::$current_key"

          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/rest/v1/" \
            --header "apikey: ${current_key}")"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase rejected the retrieved publishable key with HTTP ${status}."
            exit 1
          fi

          {
            echo 'value<<KEY_EOF'
            echo "$current_key"
            echo 'KEY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Replace project-scoped EAS preview value
        env:
          CURRENT_PUBLIC_KEY: ${{ steps.key.outputs.value }}
        run: |
          npx --yes eas-cli@22.6.0 env:set preview \
            --name EXPO_PUBLIC_SUPABASE_ANON_KEY \
            --value "$CURRENT_PUBLIC_KEY" \
            --visibility sensitive \
            --scope project \
            --non-interactive

      - name: Verify EAS preview project pair
        run: |
          npx --yes eas-cli@22.6.0 env:exec \
            preview \
            'node scripts/verify-preview-supabase-env.mjs' \
            --non-interactive

      - name: Record safe completion evidence
        run: |
          {
            echo '## EAS preview Supabase key synchronized'
            echo
            echo '- Environment: `preview`'
            echo '- Variable: `EXPO_PUBLIC_SUPABASE_ANON_KEY`'
            echo '- Scope: project'
            echo '- Supabase project: `opeojxwkwwnnncnsuaag`'
            echo '- Live project-pair verification: passed'
            echo '- EAS build submitted: no'
          } >> "$GITHUB_STEP_SUMMARY"
