name: Format Job Safety Session

on:
  push:
    branches:
      - codex/job-safety-session
    paths:
      - '.github/workflows/format-job-safety-session.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/job-safety-session
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Format Job Safety Session
        working-directory: mobile
        run: npx prettier --write app/hire/request/safety-session.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app/hire/request/safety-session.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format job safety session"
          git push
