name: Media Functions CI
on:
  push:
    paths: ['supabase/functions/**', '.github/workflows/media-functions-ci.yml']
  pull_request:
    paths: ['supabase/functions/**', '.github/workflows/media-functions-ci.yml']
jobs:
  verify-media-processing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: supabase/functions/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci --prefix supabase/functions
      - run: npm test --prefix supabase/functions
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/process-media/index.ts supabase/functions/cleanup-media/index.ts supabase/functions/structure-service-request/index.ts
